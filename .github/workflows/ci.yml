name: Multi-Platform C++ CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Cấu hình CMake mặc định cho từng OS (không ép Ninja)
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    # 2. Biên dịch (hỗ trợ cả Visual Studio trên Windows và Makefile/Clang trên Mac/Linux)
    - name: Build targets
      run: cmake --build build --config Release

    # 3. Chạy CTest (-C Release để định vị đúng file thực thi trên Windows)
    - name: Run automated tests
      run: ctest --test-dir build -C Release --output-on-failure